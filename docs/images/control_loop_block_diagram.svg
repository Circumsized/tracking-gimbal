<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1080" height="440" rx="14" fill="#0b1120" stroke="#334155" stroke-width="2"/>

  <!-- 标题 -->
  <text x="35" y="36" fill="#f8fafc" font-size="18" font-weight="700">跟踪云台双轴控制理论闭环控制框图 (Discrete-Time Feedback Control Loop)</text>
  <text x="35" y="56" fill="#94a3b8" font-size="12">基于图像特征偏差反馈的死区截断非线性比例速度控制模型 · 采样频率 50Hz (T = 0.02s)</text>

  <!-- 1. 目标参考输入 -->
  <g transform="translate(35, 140)">
    <text x="0" y="24" fill="#38bdf8" font-size="12" font-weight="bold">基准图像中心</text>
    <text x="0" y="44" fill="#ffffff" font-size="15" font-weight="bold">r(k) = [320, 240]ᵀ</text>
    <line x1="140" y1="36" x2="200" y2="36" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>

  <!-- 2. 误差比较器求和点 -->
  <g transform="translate(205, 146)">
    <circle cx="26" cy="30" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="13" y="26" fill="#38bdf8" font-size="16" font-weight="bold">+</text>
    <text x="21" y="45" fill="#f87171" font-size="18" font-weight="bold">-</text>
    <line x1="44" y1="30" x2="90" y2="30" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="65" y="20" fill="#94a3b8" font-size="11" text-anchor="middle">e(k)</text>
  </g>

  <!-- 3. 非线性死区单元 Deadzone -->
  <g transform="translate(295, 126)">
    <rect width="130" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" filter="url(#boxShadow)"/>
    <text x="65" y="24" fill="#fef3c7" font-size="12" font-weight="bold" text-anchor="middle">非线性死区截断</text>
    <!-- 死区折线图标 -->
    <path d="M 25 75 L 50 75 L 80 40 L 105 40" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="20" y1="58" x2="110" y2="58" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="65" y1="32" x2="65" y2="86" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="65" y="93" fill="#cbd5e1" font-size="10" text-anchor="middle">|e| ≤ 15px ➔ 0</text>
    <line x1="130" y1="50" x2="165" y2="50" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="148" y="42" fill="#94a3b8" font-size="11" text-anchor="middle">e_dz</text>
  </g>

  <!-- 4. 比例增益与极性调整 Kp * Direction -->
  <g transform="translate(460, 126)">
    <rect width="125" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8" filter="url(#boxShadow)"/>
    <text x="62" y="24" fill="#f3e8ff" font-size="12" font-weight="bold" text-anchor="middle">比例增益矩阵</text>
    <text x="62" y="52" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">Kp = 0.003</text>
    <text x="62" y="72" fill="#d8b4fe" font-size="10" text-anchor="middle">Yaw Dir: -1</text>
    <text x="62" y="88" fill="#d8b4fe" font-size="10" text-anchor="middle">Pitch Dir: +1</text>
    <line x1="125" y1="50" x2="165" y2="50" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="145" y="42" fill="#94a3b8" font-size="11" text-anchor="middle">ω_cmd</text>
  </g>

  <!-- 5. 零阶保持器与 SocketCAN 通信 -->
  <g transform="translate(625, 126)">
    <rect width="130" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" filter="url(#boxShadow)"/>
    <text x="65" y="24" fill="#e0f2fe" font-size="12" font-weight="bold" text-anchor="middle">离散保持与CAN</text>
    <text x="65" y="50" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">ZOH (T=20ms)</text>
    <text x="65" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">SocketCAN 1Mbps</text>
    <text x="65" y="88" fill="#34d399" font-size="10" text-anchor="middle">float32 小端打包</text>
    <line x1="130" y1="50" x2="170" y2="50" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="150" y="42" fill="#94a3b8" font-size="11" text-anchor="middle">CAN</text>
  </g>

  <!-- 6. GL40 电机驱动与机械执行体 -->
  <g transform="translate(795, 126)">
    <rect width="145" height="100" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.8" filter="url(#boxShadow)"/>
    <text x="72" y="24" fill="#ffedd5" font-size="12" font-weight="bold" text-anchor="middle">GL40 FOC 电机被控对象</text>
    <text x="72" y="48" fill="#fb923c" font-size="12" font-weight="bold" text-anchor="middle">G_m(s) = Km / (s(Tm·s+1))</text>
    <text x="72" y="70" fill="#cbd5e1" font-size="10" text-anchor="middle">直驱无回差 · FOC 速度闭环</text>
    <text x="72" y="88" fill="#94a3b8" font-size="10" text-anchor="middle">机械角位置 θ(t)</text>
  </g>

  <!-- 主回路输出至反馈 -->
  <line x1="940" y1="176" x2="1010" y2="176" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="1010" y1="176" x2="1010" y2="340" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="1010" y1="340" x2="770" y2="340" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="965" y="165" fill="#38bdf8" font-size="11">θ_gimbal</text>

  <!-- 7. 反馈通道: 相机成像透视投影与模型推理 -->
  <g transform="translate(430, 290)">
    <rect width="340" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.8" filter="url(#boxShadow)"/>
    <text x="170" y="24" fill="#d1fae5" font-size="13" font-weight="bold" text-anchor="middle">视觉反馈通道: 透视投影几何与 YuNet ONNX</text>
    <text x="170" y="48" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">y(k) = Pinhole(θ_gimbal) + Detector(YuNet)</text>
    <text x="170" y="70" fill="#cbd5e1" font-size="10.5" text-anchor="middle">像平面像素坐标解算: y(k) = [cx_face, cy_face]ᵀ</text>
    <text x="170" y="88" fill="#94a3b8" font-size="10" text-anchor="middle">焦距等效比例系数: f_px ≈ 250 px/rad · 测量延迟 τ_vision ≈ 16ms</text>
  </g>

  <!-- 反馈回求和点 -->
  <line x1="430" y1="340" x2="231" y2="340" stroke="#f87171" stroke-width="2.5"/>
  <line x1="231" y1="340" x2="231" y2="195" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="310" y="330" fill="#f87171" font-size="11" font-weight="bold">负反馈测量值 y(k)</text>
</svg>
