<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- 渐变色定义 -->
    <linearGradient id="grad-pwr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="grad-rpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="grad-can" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="grad-motor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="grad-sensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.35"/>
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- 箭头标记 -->
    <marker id="arrow-pwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-sig" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-can" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- 标题栏 -->
  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">树莓派 Zero 2 W 双轴微型视觉跟踪云台 · 全景硬件电气拓扑图</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">SYSTEM HARDWARE ELECTRICAL ARCHITECTURE &amp; PIN-LEVEL INTERCONNECT</text>

  <!-- 1. 动力输入区 (XT30) -->
  <g transform="translate(40, 100)">
    <rect width="180" height="150" rx="10" fill="url(#grad-pwr)" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="32" fill="#fca5a5" font-size="14" font-weight="bold">动力输入母线 (XT30)</text>
    <text x="20" y="60" fill="#fecaca" font-size="12">主供电: 12V ~ 24V DC</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="11">防反接设计 / 滤波电容</text>
    <rect x="20" y="105" width="60" height="26" rx="4" fill="#ef4444" opacity="0.8"/>
    <text x="32" y="122" fill="#ffffff" font-size="11" font-weight="bold">VIN (24V)</text>
    <rect x="90" y="105" width="60" height="26" rx="4" fill="#64748b" opacity="0.8"/>
    <text x="105" y="122" fill="#ffffff" font-size="11" font-weight="bold">GND</text>
  </g>

  <!-- 2. 开关降压区 (LM2596) -->
  <g transform="translate(40, 300)">
    <rect width="180" height="180" rx="10" fill="url(#grad-pwr)" stroke="#f87171" stroke-width="1.5" />
    <text x="20" y="32" fill="#fca5a5" font-size="14" font-weight="bold">开关降压回路 (U1)</text>
    <text x="20" y="55" fill="#fecaca" font-size="12">LM2596SX-5.0/NOPB</text>
    <text x="20" y="78" fill="#94a3b8" font-size="11">TO-263-5 贴片封装</text>
    <line x1="20" y1="92" x2="160" y2="92" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="20" y="112" fill="#cbd5e1" font-size="11">输入: 12~24V DC (VIN)</text>
    <text x="20" y="132" fill="#34d399" font-size="11" font-weight="bold">输出: 5.0V / 3A (VCC)</text>
    <text x="20" y="152" fill="#94a3b8" font-size="10">退耦: 10µF 0805 + AGND</text>
  </g>

  <!-- 3. 计算核心: 树莓派 Zero 2 W -->
  <g transform="translate(290, 100)">
    <rect width="360" height="580" rx="14" fill="url(#grad-rpi)" stroke="#3b82f6" stroke-width="2" />
    <text x="25" y="36" fill="#93c5fd" font-size="17" font-weight="bold">主控单元: 树莓派 Zero 2 W</text>
    <text x="25" y="60" fill="#60a5fa" font-size="12">Broadcom BCM2710A1 (4× Cortex-A53 @ 1.0GHz)</text>
    
    <!-- 内部模块 -->
    <rect x="25" y="80" width="310" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="105" fill="#38bdf8" font-size="13" font-weight="bold">MIPI CSI-2 图像输入接口 (2-Lane)</text>
    <text x="40" y="128" fill="#94a3b8" font-size="11">硬件直连 IMX219 (1640×1232 @ 50FPS 原生硬件帧)</text>

    <rect x="25" y="165" width="310" height="115" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="190" fill="#f59e0b" font-size="13" font-weight="bold">边缘神经网络检测引擎 (YuNet)</text>
    <text x="40" y="213" fill="#cbd5e1" font-size="11">输入尺度: 640×480 BGR | 推理时延: 11.8ms</text>
    <text x="40" y="233" fill="#cbd5e1" font-size="11">score_thresh: 0.6 | nms_thresh: 0.3 | top_k: 5000</text>
    <text x="40" y="253" fill="#34d399" font-size="11">最优目标决策: 遍历取最大面积 max(w × h)</text>

    <rect x="25" y="295" width="310" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="320" fill="#a78bfa" font-size="13" font-weight="bold">双轴比例速度控制律 (50Hz / 20ms)</text>
    <text x="40" y="343" fill="#cbd5e1" font-size="11">误差解算: e_x = cx - 320, e_y = cy - 240</text>
    <text x="40" y="363" fill="#f43f5e" font-size="11">死区盒: ±15px (速度归零) | 增益: Kp=0.003</text>

    <rect x="25" y="400" width="310" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="425" fill="#38bdf8" font-size="13" font-weight="bold">硬件总线通信接口驱动</text>
    <text x="40" y="445" fill="#cbd5e1" font-size="11">SPI0: MOSI(GP10), MISO(GP9), SCLK(GP11), CS(GP8)</text>
    <text x="40" y="462" fill="#cbd5e1" font-size="11">UART: TXD0(GP14), RXD0(GP15) | INT: GP25</text>

    <rect x="25" y="490" width="310" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="515" fill="#fb923c" font-size="13" font-weight="bold">Web 监控推流 (Flask :5000)</text>
    <text x="40" y="535" fill="#94a3b8" font-size="11">MJPEG 80质量分块输出 | 互斥锁帧拷贝保护</text>
  </g>

  <!-- 4. 传感器外设区 -->
  <g transform="translate(40, 520)">
    <rect width="180" height="160" rx="10" fill="url(#grad-sensor)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="20" y="30" fill="#ddd6fe" font-size="14" font-weight="bold">激光雷达 (TFmini Plus)</text>
    <text x="20" y="52" fill="#c4b5fd" font-size="11">飞行时间 (ToF) 激光测距</text>
    <text x="20" y="74" fill="#cbd5e1" font-size="11">接口: /dev/serial0 (115200)</text>
    <text x="20" y="96" fill="#cbd5e1" font-size="11">帧格式: 9-Byte 定长包</text>
    <text x="20" y="118" fill="#34d399" font-size="11">门限: Str>100 &amp; Dist!=0</text>
    <text x="20" y="140" fill="#94a3b8" font-size="10">测量范围: 0.1m ~ 12m</text>
  </g>

  <!-- 5. SPI 转 CAN 模块 (MCP2515 + SN65HVD230) -->
  <g transform="translate(710, 100)">
    <rect width="210" height="260" rx="10" fill="url(#grad-can)" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="32" fill="#6ee7b7" font-size="15" font-weight="bold">SPI-CAN 转换电路</text>
    <rect x="20" y="50" width="170" height="85" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="72" fill="#34d399" font-size="12" font-weight="bold">MCP2515T-I/ST (U2)</text>
    <text x="30" y="90" fill="#94a3b8" font-size="10">TSSOP-20 封装 | SPI 从机</text>
    <text x="30" y="106" fill="#cbd5e1" font-size="10">基准时钟: 8.000MHz 晶振 (X1)</text>
    <text x="30" y="122" fill="#fca5a5" font-size="10">中断输出: INT -> GPIO25</text>

    <rect x="20" y="150" width="170" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="172" fill="#34d399" font-size="12" font-weight="bold">SN65HVD230DR (U3)</text>
    <text x="30" y="190" fill="#94a3b8" font-size="10">SOIC-8 封装 | 3.3V CAN 收发</text>
    <text x="30" y="206" fill="#cbd5e1" font-size="10">差分对: CAN_H / CAN_L</text>
    <text x="30" y="222" fill="#38bdf8" font-size="10" font-weight="bold">传输速率: 1.0 Mbps</text>
  </g>

  <!-- 6. 执行端: CubeMars GL40 电机模组 -->
  <g transform="translate(980, 100)">
    <rect width="180" height="260" rx="10" fill="url(#grad-motor)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="32" fill="#fde68a" font-size="15" font-weight="bold">Yaw 轴无刷电机</text>
    <text x="20" y="55" fill="#fef3c7" font-size="12">CubeMars GL40 模组</text>
    <rect x="20" y="70" width="140" height="50" rx="4" fill="#1e293b"/>
    <text x="30" y="92" fill="#34d399" font-size="12" font-weight="bold">Node ID: 0x201</text>
    <text x="30" y="108" fill="#94a3b8" font-size="10">速度模式 2 | 小端 float32</text>
    <text x="20" y="145" fill="#cbd5e1" font-size="11">极性: YAW_DIR = -1</text>
    <text x="20" y="165" fill="#cbd5e1" font-size="11">供电: 24V 母线直供</text>
    <text x="20" y="185" fill="#cbd5e1" font-size="11">控制带宽: 50Hz 闭环</text>
    <text x="20" y="205" fill="#38bdf8" font-size="10">最大线速度: 0.96 rad/s</text>
    <text x="20" y="225" fill="#fca5a5" font-size="10">防冲突延时: 5ms 间隔</text>
  </g>

  <g transform="translate(980, 420)">
    <rect width="180" height="260" rx="10" fill="url(#grad-motor)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="32" fill="#fde68a" font-size="15" font-weight="bold">Pitch 轴无刷电机</text>
    <text x="20" y="55" fill="#fef3c7" font-size="12">CubeMars GL40 模组</text>
    <rect x="20" y="70" width="140" height="50" rx="4" fill="#1e293b"/>
    <text x="30" y="92" fill="#34d399" font-size="12" font-weight="bold">Node ID: 0x202</text>
    <text x="30" y="108" fill="#94a3b8" font-size="10">速度模式 2 | 小端 float32</text>
    <text x="20" y="145" fill="#cbd5e1" font-size="11">极性: PITCH_DIR = +1</text>
    <text x="20" y="165" fill="#cbd5e1" font-size="11">供电: 24V 母线直供</text>
    <text x="20" y="185" fill="#cbd5e1" font-size="11">控制带宽: 50Hz 闭环</text>
    <text x="20" y="205" fill="#38bdf8" font-size="10">最大线速度: 0.72 rad/s</text>
    <text x="20" y="225" fill="#fca5a5" font-size="10">防冲突延时: 5ms 间隔</text>
  </g>

  <!-- 连线与母线 -->
  <!-- 24V 动力线 -->
  <path d="M 220 175 L 255 175 L 255 40 L 950 40 L 950 150 L 980 150" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-pwr)"/>
  <path d="M 950 40 L 950 470 L 980 470" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-pwr)"/>
  <path d="M 130 250 L 130 300" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-pwr)"/>

  <!-- 5V 稳压线 -->
  <path d="M 220 390 L 290 390" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-sig)"/>
  <text x="235" y="380" fill="#fde68a" font-size="10" font-weight="bold">5V / 3A</text>

  <!-- 传感器线 -->
  <path d="M 220 600 L 290 600" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-sig)"/>
  <text x="225" y="590" fill="#c4b5fd" font-size="10">UART 115200</text>

  <!-- SPI 总线 -->
  <path d="M 650 200 L 710 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sig)"/>
  <text x="660" y="190" fill="#7dd3fc" font-size="10" font-weight="bold">SPI0 + INT</text>

  <!-- CAN 差分对 -->
  <path d="M 920 200 L 950 200 L 950 210 L 980 210" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-can)"/>
  <path d="M 950 200 L 950 530 L 980 530" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-can)"/>
  <text x="930" y="240" fill="#6ee7b7" font-size="10" font-weight="bold">CAN 1Mbps</text>

  <!-- 底部图例 -->
  <g transform="translate(40, 720)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#ef4444" stroke-width="2.5"/>
    <text x="38" y="14" fill="#cbd5e1" font-size="11">24V 动力高压总线</text>
    <line x1="160" y1="10" x2="190" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="198" y="14" fill="#cbd5e1" font-size="11">5V 稳压供电母线</text>
    <line x1="320" y1="10" x2="350" y2="10" stroke="#34d399" stroke-width="2.5"/>
    <text x="358" y="14" fill="#cbd5e1" font-size="11">1Mbps CAN 差分总线</text>
    <line x1="510" y1="10" x2="540" y2="10" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="548" y="14" fill="#cbd5e1" font-size="11">高速数字信号 (SPI / MIPI CSI-2 / UART)</text>
  </g>
</svg>