<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 720" width="1380" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="optBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frustumFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="mArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="mArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="mArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="mArrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 背景画布 (宽 1380，高 720，留出足够呼吸感与右侧文字区) -->
  <rect width="1380" height="720" rx="16" fill="url(#optBg)" stroke="#334155" stroke-width="2"/>

  <!-- 头部信息 -->
  <g transform="translate(45, 38)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700">针孔视觉成像几何模型与 TFmini 空间同轴测距空间投影规范</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12">Pinhole Camera Perspective Projection Geometry, Optical Axis Alignment &amp; Image Deadzone Mechanics</text>
  </g>

  <!-- 
    几何关键点绝对布局 (严格保证全部几何对象与文本完全在 1380 边界内):
    - 相机光心 Oc: (110, 360)
    - 像平面中心 c0: (460, 360) -> 主光轴严格水平对准!
    - 像平面尺寸: (360, 180) 到 (560, 540)  (宽 200px, 高 360px)
    - 3D 目标空间点 P(X, Y, Z): (920, 240)
    - 目标落点 p(u, v): (510, 305) (Oc到P连线交于像平面)
    - 激光雷达光孔: (110, 310) -> 目标面激光光斑: (920, 310)
    - 右侧文字区: x=950 ~ 1320 (留出 60px 边距，绝无截断!)
  -->

  <!-- 1. 视锥体半透明体 (Frustum) -->
  <polygon points="110,360 360,180 560,180 110,360" fill="url(#frustumFill)"/>
  <polygon points="110,360 560,180 560,540 110,360" fill="url(#frustumFill)"/>
  <polygon points="110,360 360,540 560,540 110,360" fill="url(#frustumFill)"/>
  <polygon points="110,360 360,180 360,540 110,360" fill="url(#frustumFill)"/>

  <!-- 视锥 4 条主边界棱线 -->
  <line x1="110" y1="360" x2="360" y2="180" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="110" y1="360" x2="560" y2="180" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="110" y1="360" x2="560" y2="540" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="110" y1="360" x2="360" y2="540" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- 远端视场扩张线 -->
  <line x1="360" y1="180" x2="900" y2="90" stroke="#0284c7" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.4"/>
  <line x1="560" y1="180" x2="1000" y2="90" stroke="#0284c7" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.4"/>
  <line x1="560" y1="540" x2="1000" y2="600" stroke="#0284c7" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.4"/>
  <line x1="360" y1="540" x2="900" y2="600" stroke="#0284c7" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.4"/>

  <!-- 2. 主光轴 +Z_c (严格穿过像平面中心 c0) -->
  <line x1="110" y1="360" x2="960" y2="360" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#mArrCyan)"/>
  <text x="975" y="365" fill="#38bdf8" font-size="12.5" font-weight="700">主光轴 +Z_c (视轴基准)</text>

  <!-- 3. 相机光心 Oc 及其坐标系 -->
  <g transform="translate(110, 360)">
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    <text x="-15" y="-16" fill="#38bdf8" font-size="13.5" font-weight="bold">光心 O_c (0,0,0)</text>
    <!-- Y 轴向下 (OpenCV 规范) -->
    <line x1="0" y1="0" x2="0" y2="110" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#mArrCyan)"/>
    <text x="10" y="105" fill="#38bdf8" font-size="11" font-weight="bold">+Y_c (向下)</text>
    <!-- X 轴向右 -->
    <line x1="0" y1="0" x2="-50" y2="50" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#mArrCyan)"/>
    <text x="-70" y="65" fill="#38bdf8" font-size="11" font-weight="bold">+X_c</text>
  </g>

  <!-- 4. 像平面本体 (360,180 到 560,540) -->
  <polygon points="360,180 560,180 560,540 360,540" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- 像平面像素原点 (左上角 u=0, v=0) -->
  <circle cx="360" cy="180" r="4" fill="#f59e0b"/>
  <line x1="360" y1="180" x2="410" y2="180" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mArrAmber)"/>
  <line x1="360" y1="180" x2="360" y2="230" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mArrAmber)"/>
  <text x="325" y="175" fill="#f59e0b" font-size="11" font-weight="bold">(u=0, v=0)</text>

  <!-- 像主点 c0 与十字准星 (460, 360) -->
  <circle cx="460" cy="360" r="4.5" fill="#f59e0b"/>
  <line x1="435" y1="360" x2="485" y2="360" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="460" y1="335" x2="460" y2="385" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- 死区盒 (460, 360 处的 ±15px 矩形) -->
  <rect x="446" y="347" width="28" height="26" fill="#ef4444" fill-opacity="0.4" stroke="#f87171" stroke-width="1.5"/>

  <!-- 投影落点 p(u, v) (510, 305) -->
  <circle cx="510" cy="305" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="460" y1="360" x2="507" y2="307" stroke="#10b981" stroke-width="2" marker-end="url(#mArrGreen)"/>

  <!-- 5. 3D 目标空间点 P(920, 240) 与完整右侧信息卡 -->
  <g transform="translate(920, 240)">
    <circle cx="0" cy="0" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <!-- 人脸框 -->
    <rect x="-25" y="-32" width="50" height="64" rx="8" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
    
    <!-- 右侧完整文字块卡片 (从 x=32 开始，宽 360，总横坐标为 920+32+360=1312 < 1380，留有 68px 安全边距，绝不消失或被截断) -->
    <g transform="translate(32, -40)">
      <rect width="360" height="110" rx="8" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" font-size="14.5" font-weight="bold">目标人脸中心 P(X_c, Y_c, Z_c)</text>
      <line x1="14" y1="32" x2="346" y2="32" stroke="#374151" stroke-width="1"/>
      <text x="14" y="52" fill="#f8fafc" font-size="11.5">● 测距深度: <tspan fill="#f59e0b" font-weight="bold">Z_c = Distance (cm)</tspan></text>
      <text x="14" y="74" fill="#cbd5e1" font-size="11.5">● 水平空间位置: <tspan fill="#38bdf8">X_c = (u - 320) · Z_c / f_x</tspan></text>
      <text x="14" y="96" fill="#cbd5e1" font-size="11.5">● 垂直空间位置: <tspan fill="#38bdf8">Y_c = (v - 240) · Z_c / f_y</tspan></text>
    </g>
  </g>

  <!-- 6. 透视光线: Oc(110,360) -> p(510,305) -> P(920,240) -->
  <line x1="110" y1="360" x2="510" y2="305" stroke="#10b981" stroke-width="2"/>
  <line x1="510" y1="305" x2="920" y2="240" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="690" y="260" fill="#34d399" font-size="11" font-weight="600">透视射线 (Ray of Sight)</text>

  <!-- 7. TFmini 激光测距束 (基线偏置 by=28mm, 平行出射) -->
  <g transform="translate(110, 310)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#be123c"/>
    <text x="-20" y="4" fill="#f43f5e" font-size="10.5" font-weight="bold" text-anchor="end">TFmini 雷达</text>
    <line x1="10" y1="0" x2="810" y2="0" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#mArrRed)"/>
    <text x="540" y="-10" fill="#f43f5e" font-size="11" font-weight="bold">850nm 脉冲 ToF 激光束 (平行主光轴)</text>
  </g>

  <!-- 目标面上测距光斑 -->
  <ellipse cx="920" cy="310" rx="6" ry="12" fill="#f43f5e" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.5"/>

  <!-- 基线偏置标注 -->
  <line x1="85" y1="310" x2="85" y2="360" stroke="#f43f5e" stroke-width="1.2"/>
  <line x1="80" y1="310" x2="90" y2="310" stroke="#f43f5e" stroke-width="1.2"/>
  <line x1="80" y1="360" x2="90" y2="360" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="75" y="338" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="end">b_y=28mm</text>

  <!-- ==================== 外部引出标注卡 (LEADER CALLOUTS) ==================== -->
  <!-- 标注卡 1: 像平面规格 (上方) -->
  <g transform="translate(360, 105)">
    <rect width="200" height="48" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="20" fill="#38bdf8" font-size="11.5" font-weight="bold" text-anchor="middle">虚拟正置像平面 (Z = f)</text>
    <text x="100" y="36" fill="#cbd5e1" font-size="10.5" text-anchor="middle">画幅: 640 × 480 像素矩阵</text>
    <line x1="100" y1="48" x2="100" y2="75" stroke="#38bdf8" stroke-width="1.2"/>
  </g>

  <!-- 标注卡 2: 像主点与死区盒 (左下方) -->
  <g transform="translate(210, 430)">
    <rect width="210" height="60" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="14" y="22" fill="#fde68a" font-size="11.5" font-weight="bold">像主点 c_0 (320, 240)</text>
    <text x="14" y="38" fill="#fca5a5" font-size="10.5">● 死区盒范围: [±15px]²</text>
    <text x="14" y="52" fill="#94a3b8" font-size="10">● 进入死区速度指令严格为 0</text>
    <path d="M 210 450 L 440 365" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  </g>

  <!-- 标注卡 3: 投影落点与误差向量 (上方偏右) -->
  <g transform="translate(560, 140)">
    <rect width="210" height="60" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
    <text x="14" y="22" fill="#a7f3d0" font-size="11.5" font-weight="bold">目标人脸落点 p(u, v)</text>
    <text x="14" y="38" fill="#cbd5e1" font-size="10.5">● 像素误差: e_x = u - 320</text>
    <text x="14" y="52" fill="#cbd5e1" font-size="10.5">● 像素误差: e_y = v - 240</text>
    <path d="M 560 180 L 515 300" fill="none" stroke="#10b981" stroke-width="1.2"/>
  </g>

  <!-- 8. 底部数学公式面板 (居中，与边界完全保持安全距离) -->
  <g transform="translate(45, 605)">
    <rect width="1290" height="85" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="25" fill="#38bdf8" font-size="12.5" font-weight="bold">针孔透视内参变换与视觉雅可比微分矩阵 (Pinhole Intrinsic Matrix &amp; Image Jacobian):</text>
    <g transform="translate(24, 38)">
      <text x="0" y="18" fill="#f8fafc" font-size="11.5" font-family="monospace">
        [ u ]       [ f_x   0   cx_0 ] [ X_c / Z_c ]       d(e_x)/dt = - (f_x / Z_c) · v_x + ((u - cx_0) / Z_c) · v_z + (f_x + (u - cx_0)²/f_x) · ω_pitch
      </text>
      <text x="0" y="38" fill="#f8fafc" font-size="11.5" font-family="monospace">
        [ v ] = Z_c [  0   f_y  cy_0 ] [ Y_c / Z_c ]       d(e_y)/dt = - (f_y / Z_c) · v_y + ((v - cy_0) / Z_c) · v_z - (f_y + (v - cy_0)²/f_y) · ω_yaw
      </text>
    </g>
  </g>
</svg>
